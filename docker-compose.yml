services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true